apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: europe-west1-docker.pkg.dev/{{PROJECT_ID}}/ride-sharing/trip-service
          ports:
            - containerPort: 8083
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
spec:
  type: ClusterIP
  selector:
    app: trip-service
  ports:
    - port: 8083
      name: http
      targetPort: 8083
