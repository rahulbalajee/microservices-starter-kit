apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 16686 #UI
        - containerPort: 4318  #OTLP HTTP
        env:
          - name: COLLECTOR_OTLP_ENABLED
            value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      name: ui
      targetPort: 16686
    - port: 4318
      name: otlp-http
      targetPort: 4318
  type: ClusterIP
