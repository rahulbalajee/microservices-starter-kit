apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: ride-sharing/payment-service
        ports:
          - containerPort: 9004
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "128Mi"
        env:
        - name: STRIPE_SUCCESS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: STRIPE_SUCCESS_URL
        - name: STRIPE_CANCEL_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: STRIPE_CANCEL_URL
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secrets
              key: stripe_secret_key
        - name: RABBITMQ_URI
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: uri

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 9004
      name: grpc
      targetPort: 9004
